name: Bug Report
description: Create a bug report
title: "[Bug] "
labels: ["bug", "pending"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Please describe the problem in detail
      placeholder: Describe the problem here
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe how to reproduce the issue
      placeholder: Describe the steps to reproduce here
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "Optional: describe what you expected to happen"
      placeholder: Describe the expected behavior here
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happens
      placeholder: Describe the actual behavior here
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: dropdown
    id: os
    attributes:
      label: Windows version
      description: Select the Windows version where the issue occurs
      options:
        - Windows 11
        - Windows 10
        - Other Windows version
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Software version
      description: nightly
      placeholder: nightly
    validations:
      required: true

  - type: textarea
    id: other-env
    attributes:
      label: Other environment information
      description: Provide any other relevant environment information
      placeholder: Other environment information
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (if any)
      description: Paste a log upload link or attach screenshots
      placeholder: Paste a log upload link or attach screenshots here
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: (Optional) provide any other relevant information
      placeholder: Additional information, if any
    validations:
      required: false
