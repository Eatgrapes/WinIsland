name: Documentation Update Request
description: Request an update to the documentation
title: "[Docs] "
labels: ["documentation", "pending"]
assignees: []
body:
  - type: textarea
    id: content
    attributes:
      label: Documentation update
      description: Which document needs an update, and what should change?
      placeholder: Which Docs? What to update?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this update is needed
      placeholder: explain why you want to update this content
    validations:
      required: true
