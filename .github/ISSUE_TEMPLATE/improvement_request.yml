name: Improvement Request
description: Request improvements to existing behavior or code
title: "[Improve] "
labels: ["improvement", "pending"]
assignees: []
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: Specify the module or feature to improve
      placeholder: "For example: src/core/render.rs"
    validations:
      required: false

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe the current implementation and its pain points
      placeholder: Describe current behavior
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed change
      description: Describe what should change and whether APIs or configuration are affected
      placeholder: Proposed code or configuration changes
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Benefit
      description: Describe the expected performance, maintainability, or UX benefits
      placeholder: Expected benefits
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Backward compatibility
      description: "Will this break existing APIs or configuration? Include migration steps."
      placeholder: Migration steps, if any
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Target version
      description: Enter the target version or use nightly if unknown
      placeholder: nightly
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related pull requests, issues, or code links
      placeholder: Related links
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Provide any other relevant information
      placeholder: Additional notes
    validations:
      required: false
